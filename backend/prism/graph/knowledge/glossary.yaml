# Hand-written business glossary (merged from the cash / assets / feeds / reference / market platform glossaries).
# defines: metric:<id> | concept:<Name>; tags: column:<source>.<table>.<column>; broader: another term name.
# A term's allowed_scopes come from what it defines/tags; a term bound to no source object must say `public: true`
# to be readable by everyone (an unlinked term is otherwise rejected, and fails closed in the graph).
# Synonyms are unique across the whole file (a duplicate would be ambiguous at retrieval time).
glossaries: [cash, assets, feeds, reference, market, general]

terms:
  # ---------- cash ----------
  - {name: break, glossary: cash, defines: [concept:Break], synonyms: [unmatched item, reconciliation break, recon break, cash break, discrepancy], definition: "An item that could not be matched between the internal record and the external bank statement during reconciliation."}
  - {name: open break, glossary: cash, defines: [metric:open_breaks], broader: break, synonyms: [outstanding break, unresolved break], definition: "A break whose status is not closed (open or investigating)."}
  - {name: aged break, glossary: cash, defines: [metric:aged_open_breaks], broader: open break, synonyms: [old break, stale break, overdue break], definition: "An open break older than 5 days.", rule: "status <> 'closed' AND age_days > 5"}
  - {name: break age, glossary: cash, defines: [metric:avg_break_age], broader: break, synonyms: [age of breaks, break ageing, days outstanding], definition: "Days since an open break was raised, averaged over open breaks."}
  - {name: break amount, glossary: cash, defines: [metric:open_break_amount], broader: break, synonyms: [break value, break exposure], definition: "Amount of open breaks per currency; never summed across currencies."}
  - {name: resolution, glossary: cash, defines: [metric:break_resolution_rate], broader: break, synonyms: [closure, fix, cleared, resolution rate], definition: "The act of closing a break or exception after investigation; as a rate, the share of breaks that have been closed."}
  - {name: nostro account, glossary: cash, defines: [concept:CashAccount], tags: [column:cashrecon.cash_accounts.nostro_no], synonyms: [cash account, bank account, correspondent account, nostro], definition: "A bank account held with a correspondent bank whose statement is reconciled against internal cash ledger entries."}
  - {name: auto-match rate, glossary: cash, defines: [metric:auto_match_rate], synonyms: [automatic match rate, STP rate, straight-through matching, auto match percentage], definition: "The share of items matched automatically by the matching engine without manual intervention."}
  - {name: manual match, glossary: cash, defines: [metric:manual_matches], synonyms: [manual override, hand match, forced match, manual matching], definition: "A match group created by an operations user rather than by the matching engine."}
  - {name: currency, glossary: cash, tags: [column:cashrecon.breaks.ccy], synonyms: [ccy, FX currency], definition: "The ISO 4217 currency of a transaction or amount."}
  - {name: region, glossary: cash, tags: [column:cashrecon.breaks.region], synonyms: [geography, location, EMEA, APAC, AMER], definition: "The geographic area an entity or account belongs to."}
  # ---------- feeds ----------
  - {name: late feed, glossary: feeds, defines: [metric:late_feeds], synonyms: [delayed file, late delivery, overdue feed, delayed feed], definition: "A data feed delivery that did not arrive by its scheduled cut-off time, or failed or was missing (status other than on_time)."}
  - {name: feed latency, glossary: feeds, defines: [metric:avg_feed_latency_min], synonyms: [delivery delay, feed lag, lateness], definition: "Minutes between the expected and the actual receipt of a late feed."}
  - {name: on-time delivery, glossary: feeds, defines: [metric:feed_on_time_rate], synonyms: [on time rate, SLA met, delivered on schedule], definition: "Share of feed deliveries received on time."}
  - {name: missing delivery, glossary: feeds, defines: [metric:missing_or_failed_deliveries], synonyms: [failed feed, missing file, failed delivery], definition: "A delivery that never arrived (missing) or failed."}
  - {name: support ticket, glossary: feeds, defines: [metric:open_support_tickets], synonyms: [ticket, incident, help desk case, service request, vendor ticket], definition: "A case raised with support about a feed or data problem; categories include late, missing_file, credential_change and format_change."}
  - {name: feed delivery, glossary: feeds, defines: [concept:FeedDelivery], synonyms: [file delivery, data file, inbound feed], definition: "One scheduled arrival of a data file from a source system or vendor on a business date."}
  - {name: feed source, glossary: feeds, defines: [concept:DataSource], tags: [column:feedhub.sources.source_id], synonyms: [data provider, sender, feed provider], definition: "An external party (bank, custodian or vendor) delivering feeds; identified by source_id such as SRC001."}
  - {name: SLA, glossary: feeds, public: true, synonyms: [service level agreement, cut-off time, service level], definition: "The agreed deadline or quality target that a process or data delivery must meet."}
  # ---------- assets ----------
  - {name: position, glossary: assets, defines: [concept:Position], synonyms: [holding, security position], definition: "Holding of a security in a portfolio, from the internal book or as reported by the custodian."}
  - {name: position break, glossary: assets, defines: [metric:position_exceptions, metric:open_position_exceptions], synonyms: [position mismatch, holdings mismatch, holdings difference, position exception], definition: "A difference between internal holdings and the custodian's reported position for a security; open ones have status open."}
  - {name: NAV break, glossary: assets, defines: [metric:nav_break_bps_max, metric:nav_breaches_above_5bps], synonyms: [NAV difference, NAV variance, NAV tolerance breach, net asset value discrepancy], definition: "A difference between the fund administrator's net asset value and the internally calculated NAV, measured in basis points; above 5 bps is a breach."}
  - {name: recon run, glossary: assets, defines: [metric:clean_recon_run_rate, metric:recon_unmatched_items], synonyms: [reconciliation run, matching run, recon job], definition: "One execution of a reconciliation process comparing two sources for a portfolio and date; a clean run has no unmatched items."}
  - {name: recon type, glossary: assets, tags: [column:assetrecon.recon_runs.recon_type], synonyms: [reconciliation type, recon kind], definition: "The kind of reconciliation a run performs: position, cash, transaction or nav. The transaction type is spelled 'transaction', not 'txn'."}
  - {name: position exception market value, glossary: assets, defines: [metric:exception_mv_abs], tags: [column:assetrecon.recon_exceptions.diff_mv], synonyms: [exception MV, MV difference, market value difference], definition: "Absolute market-value difference (base currency) between internal and custodian positions, summed over position exceptions."}
  - {name: custodian, glossary: assets, defines: [concept:DataSource], tags: [column:assetrecon.custodians.custodian_id], synonyms: [custodian bank, depository, depositary, safekeeping agent, custody bank], definition: "The institution that holds securities on behalf of the fund and reports official positions."}
  - {name: portfolio, glossary: assets, defines: [concept:Portfolio], tags: [column:assetrecon.portfolios.portfolio_id], synonyms: [fund, investment fund], definition: "An investment fund belonging to a fund group, identified by portfolio_id such as PF001."}
  - {name: fund group, glossary: assets, tags: [column:assetrecon.portfolios.fund_group], synonyms: [fund family, fund umbrella, portfolio group], definition: "A grouping of funds managed or reported together."}
  - {name: fund administrator, glossary: assets, public: true, synonyms: [administrator, fund accountant, third-party administrator], definition: "The external party that calculates the official NAV of a fund."}
  - {name: basis point, glossary: assets, public: true, synonyms: [bps, bp, one hundredth of a percent], definition: "One hundredth of one percent (0.01%), used to measure small differences such as NAV breaks."}
  - {name: base currency, glossary: assets, tags: [column:assetrecon.portfolios.base_ccy], synonyms: [reporting currency], definition: "The currency in which amounts are converted for aggregated reporting."}
  # ---------- reference ----------
  - {name: security, glossary: reference, defines: [concept:Security], tags: [column:refmaster.securities.security_id], synonyms: [instrument, financial instrument, tradable instrument], definition: "A tradable financial instrument such as an equity, bond or fund."}
  - {name: security master, glossary: reference, public: true, synonyms: [instrument master, securities reference data, secmaster], definition: "The mastered reference database of securities and their static attributes."}
  - {name: ISIN, glossary: reference, tags: [column:refmaster.securities.isin], synonyms: [international securities identification number, security identifier], definition: "The 12-character ISO 6166 code that identifies a security."}
  - {name: LEI, glossary: reference, tags: [column:refmaster.legal_entities.lei], synonyms: [legal entity identifier], definition: "The 20-character ISO 17442 code that uniquely identifies a legal entity in financial transactions."}
  - {name: legal entity, glossary: reference, defines: [concept:LegalEntity], tags: [column:refmaster.legal_entities.entity_id], synonyms: [entity, booking entity, company, issuer, counterparty], definition: "A legally registered organisation such as a fund or bank subsidiary, used as a reporting dimension."}
  - {name: issuer country, glossary: reference, broader: legal entity, tags: [column:refmaster.legal_entities.country], synonyms: [country of issuer, domicile], definition: "Country of the legal entity that issued the security."}
  - {name: asset class, glossary: reference, tags: [column:refmaster.securities.asset_class], synonyms: [instrument type, security type], definition: "A category of instruments such as equity, corp bond, govt, FX or derivatives."}
  - {name: corporate action, glossary: reference, public: true, synonyms: [corp action, dividend, stock split, merger event], definition: "An event initiated by an issuer that changes securities, such as a dividend, split or merger."}
  - {name: exception, glossary: reference, public: true, synonyms: [issue, alert, rule failure], definition: "A record flagged by a control or rule for investigation, such as a position mismatch or a data-quality rule failure."}
  - {name: data-quality exception, glossary: reference, broader: exception, defines: [metric:open_dq_exceptions, metric:dq_exceptions_total], synonyms: [DQ exception, validation failure, data quality issue], definition: "A reference-data record failing a validation rule; open ones are not yet closed."}
  - {name: data quality rule, glossary: reference, public: true, synonyms: [DQ rule, validation rule, data check], definition: "A validation rule applied to reference data whose failures create data-quality exceptions."}
  - {name: data domain, glossary: reference, public: true, synonyms: [domain, subject area], definition: "A subject area of reference data such as securities, entities or prices."}
  - {name: data steward, glossary: reference, public: true, synonyms: [data owner, steward], definition: "The person accountable for the quality and resolution of data issues in a data domain."}
  - {name: four-eyes approval, glossary: reference, public: true, synonyms: [maker-checker, dual control, second approval], definition: "A control requiring a second person to approve a change before it takes effect."}
  - {name: data lineage, glossary: reference, public: true, synonyms: [provenance, lineage, source-to-target mapping], definition: "The trace of where a data element came from and how it was transformed."}
  - {name: ESG score, glossary: reference, tags: [column:marketmaster.esg_scores.score], synonyms: [sustainability score, environmental social governance rating], definition: "A rating of an entity's environmental, social and governance performance."}
  # ---------- market ----------
  - {name: golden copy, glossary: market, defines: [concept:Price], synonyms: [golden price, golden record, mastered record, master record], definition: "The mastered, validated version of a price or reference record chosen from multiple vendor sources."}
  - {name: price conflict, glossary: market, defines: [metric:price_conflicts], synonyms: [price disagreement, price mismatch, price discrepancy, price challenge, price-source conflict, vendor price deviation], definition: "A vendor price quote that deviates from the golden price beyond tolerance."}
  - {name: stale price, glossary: market, public: true, synonyms: [unchanged price, frozen price, old price], definition: "A price that has not been updated by the vendor for longer than the expected refresh interval."}
  - {name: vendor, glossary: market, defines: [concept:Vendor], tags: [column:marketmaster.vendors.vendor_id], synonyms: [data vendor, price source, pricing source, price vendor], definition: "An external provider supplying prices or reference data; vendor ids look like V_A (Vendor A)."}
  - {name: tolerance, glossary: market, public: true, synonyms: [threshold, materiality threshold], definition: "The allowed deviation before a difference is treated as a break, conflict or exception."}
  # ---------- general ----------
  - {name: week over week, glossary: general, public: true, synonyms: [WoW, w/w, weekly change, this week], definition: "Comparison of this week with the prior week. 'This week' means the trailing 5 business days ending at the as-of date, not the ISO calendar week; the prior week is the 5 business days before that.", rule: "this week = trailing 5 business days ending at the as-of date"}
  - {name: business day, glossary: general, public: true, synonyms: [working day, weekday], definition: "A Monday to Friday day; no holiday calendar is applied."}
