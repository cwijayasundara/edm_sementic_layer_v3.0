id: open_breaks
source: cashrecon
description: Number of open cash reconciliation breaks (open = status <> 'closed', i.e. open or investigating).
type: count
expr: count(*)
from: breaks
base_filter: status <> 'closed'
time_column: opened_on
dimensions:
  region: region
  ccy: ccy
  break_type: break_type
  legal_entity_id: legal_entity_id
  bank_source_id: bank_source_id
filters:
  region: {expr: region, type: str}
  ccy: {expr: ccy, type: str}
  break_type: {expr: break_type, type: str}
  legal_entity_id: {expr: legal_entity_id, type: str}
  status: {expr: status, type: str}
  age_days: {expr: age_days, type: int}
  bank_source_id: {expr: bank_source_id, type: str}
unit: breaks
default_order: metric_desc
fine_grain_dimensions: [bank_source_id]  # identifier: at most one per metrics-only call
