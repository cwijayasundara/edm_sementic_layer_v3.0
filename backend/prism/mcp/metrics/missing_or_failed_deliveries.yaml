id: missing_or_failed_deliveries
source: feedhub
description: Feed deliveries that never arrived usable (missing or failed); a subset of late_feeds.
type: count
expr: count(*)
from: feed_deliveries
base_filter: status IN ('missing', 'failed')
time_column: business_date
dimensions:
  source_id: source_id
  source_type: source_type
  status: status
  business_date: business_date
filters:
  source_id: {expr: source_id, type: str}
  source_type: {expr: source_type, type: str}
  status: {expr: status, type: str}
unit: deliveries
default_order: metric_desc
fine_grain_dimensions: [source_id, business_date]  # one delivery per source per date: never both for metrics-only
