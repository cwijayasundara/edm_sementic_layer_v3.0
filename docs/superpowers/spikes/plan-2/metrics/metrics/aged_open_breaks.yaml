id: aged_open_breaks
source: cashrecon
description: Open (not closed) cash breaks older than 5 days.
type: count
expr: count(*)
from: breaks
base_filter: status <> 'closed' AND age_days > 5
time_column: opened_on
dimensions:
  legal_entity_id: legal_entity_id
  ccy: ccy
  region: region
filters:
  legal_entity_id: {expr: legal_entity_id, type: str}
  ccy: {expr: ccy, type: str}
  region: {expr: region, type: str}
  age_days: {expr: age_days, type: int}
unit: breaks
default_order: metric_desc
